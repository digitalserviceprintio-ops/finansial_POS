<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4648d4" />
      <stop offset="50%" stop-color="#2b2dbe" />
      <stop offset="100%" stop-color="#14157d" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#ffb700" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner POS Card / Emblem -->
  <g filter="url(#shadow)">
    <!-- POS Terminal Body -->
    <rect x="100" y="80" width="312" height="352" rx="36" fill="#ffffff" />
    
    <!-- Screen Header -->
    <rect x="124" y="104" width="264" height="140" rx="20" fill="#0f172a" />
    
    <!-- DelPOS "D" Stylized Logo on Screen -->
    <path d="M156 136 H200 C226 136 244 152 244 174 C244 196 226 212 200 212 H156 Z" fill="#4648d4" />
    <path d="M174 154 H196 C208 154 216 162 216 174 C216 186 208 194 196 194 H174 Z" fill="#ffffff" />

    <!-- Growth Graph Bars on Screen -->
    <rect x="270" y="180" width="18" height="32" rx="4" fill="#10b981" />
    <rect x="296" y="160" width="18" height="52" rx="4" fill="#10b981" />
    <rect x="322" y="140" width="18" height="72" rx="4" fill="#10b981" />
    <rect x="348" y="125" width="18" height="87" rx="4" fill="#ffb700" />

    <!-- Keypad Matrix -->
    <rect x="136" y="270" width="56" height="34" rx="8" fill="#e2e8f0" />
    <rect x="206" y="270" width="56" height="34" rx="8" fill="#e2e8f0" />
    <rect x="276" y="270" width="56" height="34" rx="8" fill="#e2e8f0" />
    <rect x="346" y="270" width="30" height="78" rx="8" fill="#10b981" />

    <rect x="136" y="314" width="56" height="34" rx="8" fill="#e2e8f0" />
    <rect x="206" y="314" width="56" height="34" rx="8" fill="#e2e8f0" />
    <rect x="276" y="314" width="56" height="34" rx="8" fill="#e2e8f0" />

    <rect x="136" y="358" width="126" height="34" rx="8" fill="#4648d4" />
    <rect x="276" y="358" width="100" height="34" rx="8" fill="#ff7b00" />
  </g>

  <!-- Curved Dynamic Swoosh -->
  <path d="M70 420 C180 470 340 440 450 260" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" />
  <circle cx="450" cy="260" r="16" fill="#ffb700" />
</svg>
