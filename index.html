    <!-- Intercept & Prevent Benign Sandboxed Vite WebSocket Closed/HMR Warnings -->
    <script>
      (function() {
        var isWsError = function(err) {
          if (!err) return false;
          var msg = typeof err === 'string' ? err : (err.message || err.reason || '');
          return /websocket|vite|ws/i.test(msg) && /closed without opened|failed to connect/i.test(msg);
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
